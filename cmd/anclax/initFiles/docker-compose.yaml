services:
  dev:
    build: 
      dockerfile: ./dev/Dockerfile.dev
    ports:
      - "2910:2910"
    command:
    - go
    - run
    - cmd/main.go
    environment:
      MYAPP_ENABLESIMPLEAUTH: true
      MYAPP_ANCLAX_PORT: 2910
      MYAPP_ANCLAX_PG_DSN: "postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/postgres"
    volumes:
      - ./:/app
      - go-data:/go/pkg/mod
      - go-build-data:/root/.cache/go-build

  db: 
    image: "postgres:latest"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

volumes:
  db-data:
  go-data:
  go-build-data:
